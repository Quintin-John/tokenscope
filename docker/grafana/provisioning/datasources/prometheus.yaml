apiVersion: 1

# Provisioned datasource. Grafana picks this up on container start.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Match prometheus.yml scrape_interval — controls Grafana's "auto" step
      # calculation in PromQL queries.
      timeInterval: "15s"
      httpMethod: POST
