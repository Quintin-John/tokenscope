# Prometheus scrape configuration for the tokenscope receiver stack.
#
# Two scrape targets:
#   - otel-collector:8889  → the OTLP-to-Prometheus exporter (where tokenscope
#                            metrics land)
#   - otel-collector:8888  → the OTEL Collector's internal self-metrics
#                            (queue depth, dropped points, etc.)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: tokenscope

scrape_configs:
  - job_name: 'tokenscope'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: otel-collector-prometheus-exporter

  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          source: otel-collector-self
