# tokenscope.example.yaml
#
# Copy to tokenscope.yaml and edit. The collector resolves any null path
# fields to platform defaults at startup and logs the resolved values, so
# debugging "where did it look?" is always a top-of-log answer.
#
# Strict validation: unknown keys produce a startup error naming the full
# path (e.g. "Unknown configuration key 'session_logs.scan_recursive'").

# Schema version. The collector fails fast on unsupported values.
schema_version: 1

# OpenTelemetry export configuration.
# Advanced exporter settings (auth headers, TLS, timeouts) use standard
# OTEL environment variables — see docs/architecture.md for a worked
# example with OTEL_EXPORTER_OTLP_HEADERS.
otlp:
  endpoint: "http://localhost:4317"
  protocol: "grpc"                      # "grpc" or "http"

# Where session logs live and how they're processed.
session_logs:
  # null  → auto-detect $HOME/.claude/projects (permissive: warn + watch for creation)
  # path  → explicit path (strict: fail-fast if it doesn't exist)
  path: null

  # On startup, process pre-existing .jsonl files using the state file's
  # resume offsets. Disable for live-only mode.
  initial_scan_enabled: true

  # Skip session files older than N days during the initial scan. Sensible
  # default for fresh installs with months of accumulated logs.
  # Set to null for "no age limit" — useful when you want full history.
  initial_scan_max_age_days: 30

  # Window for the tokenscope.sessions.active observable gauge. A session
  # is "active" if its most recent event timestamp is within this window
  # of the current time.
  active_session_window_minutes: 10

# Pricing configuration.
pricing:
  config_path: "./config/pricing.json"

  # Watch the pricing file via FileSystemWatcher; reload atomically on
  # change. Invalid edits keep the previous good table in place.
  hot_reload_enabled: true

# Where the resume-state file lives. The file records per-session
# (path, mtime, byte_offset, last_processed_line_number) so a restart
# resumes work without re-processing the entire history.
state:
  # null → $HOME/.tokenscope/state
  path: null

# Subscription mode. Affects display labels only; cost math is identical
# across modes. Surfaced as the OTEL resource attribute
# "tokenscope.subscription_mode" so Grafana and CLI can show the right
# banner without re-reading config.
#
# Values: "enterprise" | "pro" | "max5x" | "max20x"
subscription_mode: "enterprise"

# Microsoft.Extensions.Logging configuration.
logging:
  level: "Information"                  # Trace | Debug | Information | Warning | Error | Critical | None
  format: "console"                     # v1: "console" only
