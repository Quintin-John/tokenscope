[client]
# Hide the "Deploy" button (and the "Stop" button) while keeping the
# hamburger menu so the user still has Settings / Print / About.
# "viewer" is the right level: it drops the deploy-and-stop toolbar but
# leaves the kebab menu intact.
toolbarMode = "viewer"

# Drop "Ask Google" / "Ask ChatGPT" affordances under exceptions. For a
# local-only dashboard, the user already has the full source — they'd
# rather ask the project maintainer than route their stacktrace into
# someone else's product.
# "stacktrace" keeps the trace visible for debugging but removes the AI
# helper buttons that "full" (default) adds.
showErrorDetails = "stacktrace"

[browser]
# Belt-and-braces against ever leaking telemetry from a local-only dashboard.
gatherUsageStats = false

[theme]
# Streamlit's default `primaryColor` is a saturated red (`#FF4B4B`).
# That bleeds into the multiselect tag fill, segmented-control active
# state, toggle accent, and the page-selector radio — making the
# sidebar's selected filter chips read as "error" / "destructive
# action". Red is reserved for warnings and errors throughout the
# product.
#
# The accent is a calm slate-indigo (`#475569`, slate-600). It carries
# the brand for active/selected states; chip backgrounds are styled
# separately to a neutral slate-100 via `src/tokenscope/ui/_sidebar_styles.css`
# so chips don't compete with active controls for visual weight.
primaryColor = "#475569"
