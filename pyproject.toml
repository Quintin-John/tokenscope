[project]
name = "tokenscope-viz"
version = "0.1.0"
description = "Local-first interactive dashboard for Claude Code token usage and cost (ccusage-backed)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Quintin Johnsmith", email = "quintinjohnsmith@gmail.com" }]
keywords = ["claude", "claude-code", "ccusage", "observability", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
tokenscope = "tokenscope.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that shell out to a real, locally-installed ccusage (opt-in via -m integration)",
]
addopts = "-m 'not integration'"
